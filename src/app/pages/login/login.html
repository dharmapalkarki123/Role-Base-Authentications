<div class="login-wrapper">
  <div class="login-card">

    <div class="text-center mb-4">
      <i class="bi bi-hospital login-icon"></i>
      <h3 class="fw-bold mt-2">MediCare</h3>
      <p class="text-muted">Hospital Management System</p>
    </div>

    <h5 class="fw-semibold mb-1">Welcome Back!</h5>
    <p class="text-muted mb-4">Please login to your account.</p>

    <form>
      <div class="mb-3">
        <label class="form-label">User Name</label>
        <input type="text" [(ngModel)]="loginObj.userName" ) name="userName" class="form-control"
               placeholder="Enter your UserName">
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" [(ngModel)]="loginObj.password" name="password" class="form-control"
               placeholder="Enter your password">
      </div>



      <div class="d-flex justify-content-between mb-4">
        <div class="form-check">
          <input type="checkbox" class="form-check-input">
          <label class="form-check-label small">Remember me</label>
        </div>
        <a href="#" class="small text-decoration-none">Forgot password?</a>
      </div>

      <button type="button" (click)="onLogin()" class="btn btn-primary w-100">
        Sign In
      </button>
    </form>

    <p class="text-center text-muted small mt-4 mb-0">
      © 2026 MediCare Hospital Management
    </p>

  </div>
</div>
