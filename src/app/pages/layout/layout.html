<div class="app-layout">

  <!-- Sidebar -->
  <aside class="sidebar">

    <div class="brand">
      <i class="bi bi-hospital"></i>
      <span>MediCare</span>
    </div>

    <div class="sidebar-menu">

      <p class="menu-heading">MAIN MENU</p>

    @for(item of  roleWiseMenuList; track $index){
      <a [routerLink]="item.route"

         class="menu-item">
        <i class="bi bi-grid"></i>
        {{item.menuTitle}}
      </a>

      }







      <a routerLink="patients"

         class="menu-item">
        <i class="bi bi-people"></i>
        Patients
      </a>

      @if(loggedUserData.role=="Patient" ||loggedUserData.role=="Reception"){
        <a routerLink="appointmentList"

                 class="menu-item">
        <i class="bi bi-calendar-check"></i>
        Appointments
      </a>
      }




    </div>

    <div class="sidebar-bottom">
      <div class="user-profile">
        <div class="user-avatar">DK</div>
        <div>
          <h6 class="mb-0">Dharmapal Karki</h6>
          <small>ADMIN</small>
        </div>
      </div>
    </div>

  </aside>


  <!-- Main Content -->
  <main class="main-content">

    <!-- Navbar -->
    <nav class="top-navbar">

      <div>
        <h5 class="mb-0">Hospital Management</h5>
        <small class="text-muted">Manage your hospital efficiently</small>
      </div>

      <div class="d-flex align-items-center gap-3">

        <button class="notification-btn">
          <i class="bi bi-bell"></i>
        </button>

        <div class="d-flex align-items-center gap-2">
          <div class="user-avatar">DK</div>
          <div>
            <h6 class="mb-0">Dharmapal</h6>
            <small class="text-muted">Administrator</small>
          </div>
        </div>

        <button class="btn btn-outline-danger btn-sm">
          <i class="bi bi-box-arrow-right me-1"></i>
          Logout
        </button>

      </div>

    </nav>


    <!-- Child Components -->
    <div class="page-content">
      <router-outlet></router-outlet>

    </div>

  </main>

</div>
